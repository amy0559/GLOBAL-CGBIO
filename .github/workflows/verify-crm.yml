name: verify-crm
on:
  push:
    paths: ['.github/workflows/verify-crm.yml', 'verify/verify_crm.js', 'crm.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency: verify-crm
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i playwright@1.47.0 && npx playwright install --with-deps chromium
      - run: node verify/verify_crm.js
      - if: always()
        run: |
          git config user.name "crm-verify" && git config user.email "crm-verify@users.noreply.github.com"
          git pull --rebase -q || true
          git add verify/result.json && git commit -q -m "verify: real-browser check of crm.html [skip ci]" && git push -q
