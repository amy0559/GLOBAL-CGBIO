<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글로벌 파트너 & 리드 CRM</title>
<script>document.documentElement.dataset.theme = "light";</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
/* ============================================================================
   Control-tower layout: a full-bleed navy top bar (brand · status · tabs) over a 1480px column of white cards on a cool grey
   field. Type scale 11.5 / 12.5 / 13.5 / 15 / 17 / 21 / 36 (numerals in Barlow). Color = one accent blue for interaction,
   a six-hue infographic set for KPI tiles and charts, three status colors (ok / warn / bad) for chips, dots and flagged numbers.
   No pills (6px radii), no stripes.
   ============================================================================ */
:root {
  --bg: #eef2f7; --panel: #ffffff; --panel-2: #f4f7fb; --panel-3: #e9eef6; --fg: #0b1324; --fg-2: #1f2b44; --muted: #5b6b82; --line: #dde4ee; --line-2: #c3cedd;
  --accent: #2563eb; --accent-2: #1d4ed8; --accent-ink: #ffffff; --accent-soft: #e8efff; --accent-soft-2: #d6e2ff;
  --ok: #15803d; --ok-soft: #e1f5e8; --warn: #b45309; --warn-soft: #fff1dc; --bad: #c62828; --bad-soft: #fde4e2;
  --navy: #0b1f44; --navy-2: #123468; --navy-ink: #ffffff; --navy-dim: #a9bddf; --navy-line: rgba(255, 255, 255, .14);
  --head: var(--navy); --head-ink: var(--navy-ink); --head-dim: var(--navy-dim);
  /* infographic hues (KPI tiles, charts, step phases) */
  --h-blue: #2563eb; --h-blue-soft: #e8efff; --h-teal: #0f766e; --h-teal-soft: #dcf3ef; --h-violet: #6d28d9; --h-violet-soft: #ece6ff;
  --h-amber: #b45309; --h-amber-soft: #fff1dc; --h-green: #15803d; --h-green-soft: #e1f5e8; --h-rose: #be123c; --h-rose-soft: #ffe4ea; --h-slate: #475569; --h-slate-soft: #e9eef5;
  /* legacy names used by the chart code */
  --teal: var(--h-teal); --blue: var(--h-blue); --pink: var(--h-rose); --purple: var(--h-violet); --orange: #f59e0b; --green: var(--h-green); --red: var(--bad);
  --teal-soft: var(--h-teal-soft); --blue-soft: var(--h-blue-soft); --pink-soft: var(--h-rose-soft); --purple-soft: var(--h-violet-soft); --orange-soft: var(--warn-soft); --green-soft: var(--ok-soft); --red-soft: var(--bad-soft);
  --font: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; --num: "Barlow", "Noto Sans KR", system-ui, sans-serif;
  --radius: 12px; --radius-s: 8px; --radius-xs: 6px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px -18px rgba(15, 23, 42, .22); --shadow-2: 0 12px 32px -12px rgba(15, 23, 42, .28);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13.5px; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 21px; font-weight: 800; letter-spacing: -.015em; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 800; color: var(--fg); letter-spacing: -.01em; line-height: 1.3; }
h3 { font-size: 14px; font-weight: 700; color: var(--fg-2); }
a { color: var(--accent); }
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.muted { color: var(--muted); } td small, .kv small { font-size: 12px; }
/* ---- top bar ---------------------------------------------------------------------------------------------------- */
.bar { background: linear-gradient(100deg, var(--navy) 0%, var(--navy-2) 70%, #16407f 100%); color: var(--navy-ink); padding: 0 max(20px, env(safe-area-inset-left, 0px)) 0 max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid #0a1a38; box-shadow: 0 10px 30px -22px rgba(11, 31, 68, .9); }
.bar-inner { max-width: 1480px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 24px; padding: 16px 0 12px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand .mark { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: grid; place-items: center; font-family: var(--num); font-weight: 800; font-size: 15px; letter-spacing: .02em; color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25), 0 6px 16px -8px #1d4ed8; flex: none; }
.bar .eyebrow { font-family: var(--num); font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--navy-dim); text-transform: uppercase; }
.bar h1 { color: var(--navy-ink); }
.bar .sub { font-size: 12.5px; color: var(--navy-dim); margin-top: 3px; }
.bar .meta { text-align: right; font-size: 12px; line-height: 1.5; color: var(--navy-dim); display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.bar .meta b { color: var(--navy-ink); font-weight: 700; font-family: var(--num); font-size: 12.5px; letter-spacing: .04em; }
.bar .badge { background: rgba(255, 255, 255, .09); color: var(--navy-ink); border-color: var(--navy-line); }
.bar .badge::before { background: var(--navy-dim); } .bar .badge.shared::before { background: #4ade80; } .bar .badge.local::before { background: #fbbf24; } .bar .badge.ro::before { background: #f87171; } .bar .badge.inbox::before { background: #93c5fd; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: var(--radius-xs); padding: 3px 9px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.badge.shared::before { background: var(--ok); } .badge.local::before { background: var(--warn); } .badge.ro::before { background: var(--bad); } .badge.inbox::before { background: var(--accent); } .badge.inbox.busy::before { background: var(--warn); animation: pulse 1s infinite; } @keyframes pulse { 50% { opacity: .3; } }
/* tabs live in the bar: text + number, underline for the current one, no pills */
.tabs { max-width: 1480px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; }
.tabs a { text-decoration: none; color: rgba(255, 255, 255, .74); padding: 10px 14px 11px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; }
.tabs a:hover { color: #fff; background: rgba(255, 255, 255, .06); }
.tabs a[aria-current="page"] { color: #fff; border-bottom-color: #8fb3ff; background: rgba(255, 255, 255, .08); }
.tabs a:focus-visible { outline: 2px solid #8fb3ff; outline-offset: -2px; }
.tabs a .n { font-family: var(--num); font-size: 12px; font-weight: 700; letter-spacing: .04em; color: rgba(255, 255, 255, .55); } .tabs a[aria-current="page"] .n { color: #8fb3ff; }
.tabs a.go { margin-left: auto; order: 9; color: #fff; border: 1px solid rgba(255, 255, 255, .28); border-radius: var(--radius-s); padding: 7px 14px; margin-bottom: 8px; margin-top: 2px; background: rgba(255, 255, 255, .06); } .tabs a.go:hover { background: rgba(255, 255, 255, .14); } .tabs a.go[aria-current="page"] { background: #fff; color: var(--navy); border-color: #fff; } .tabs a.go .n { color: inherit; }
/* ---- page column ----------------------------------------------------------------------------------------------- */
.wrap { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: 18px max(20px, env(safe-area-inset-right, 0px)) 72px max(20px, env(safe-area-inset-left, 0px)); }
.page { display: flex; flex-direction: column; gap: 16px; }
.stars { display: inline-flex; gap: 2px; } .stars .star { all: unset; cursor: pointer; font-size: 22px; line-height: 1; color: #8592a6; } .stars .star.on { color: #f59e0b; } .stars .star:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.relay { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; background: var(--panel-2); } .relay-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .relay-link { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--num); font-size: 12.5px; word-break: break-all; } .relay .note { margin: 0; }
.banner { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: var(--radius-s); padding: 9px 14px; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; box-shadow: var(--shadow); }
.banner.bad { border-left-color: var(--bad); } .banner.info { border-left-color: var(--accent); }
/* ---- panels & grids ---------------------------------------------------------------------------------------------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-head .code { display: none; } .panel-head { align-items: center; } .panel-head details.help { margin: 0 0 0 auto; } .panel-head details.help[open] { flex-basis: 100%; margin: 0; }
.panel .note { color: var(--muted); font-size: 12.5px; line-height: 1.55; max-width: 96ch; }
details.help { margin-top: 0; } details.help summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 8px 2px 6px; border: 1px solid var(--line); border-radius: var(--radius-xs); background: var(--panel-2); user-select: none; } details.help summary::-webkit-details-marker { display: none; } details.help summary::before { content: "?"; display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-2); font-family: var(--num); font-size: 11.5px; } details.help summary:hover { color: var(--accent-2); border-color: var(--accent-soft-2); } details.help[open] summary { color: var(--accent-2); } details.help .note { margin-top: 8px; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 16px; align-items: stretch; }
.g2.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 36rem), 1fr)); }
.g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 16px; align-items: stretch; } .detail .g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); }
.g2.side { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); } .g2.side.diag-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); } @media (max-width: 900px) { .g2.side, .g2.side.diag-grid { grid-template-columns: 1fr; } }
/* ---- KPI tiles: label / number / context, each tile in its own hue (cycled), flagged tiles in red ----------------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.6rem), 1fr)); gap: 12px; } .kpis.k2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpi { --h: var(--h-blue); --hs: var(--h-blue-soft); position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 13px; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.kpi > * { position: relative; }
.kpi .l { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kpi .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--panel-3); margin-top: 10px; } .kpi .bar i { display: block; height: 100%; } .kpi .bar i.a { background: var(--accent); } .kpi .bar i.b { background: var(--accent); opacity: .4; } .kpi .bar i.c { background: var(--accent); opacity: .18; }
.kpi .v { font-family: var(--num); font-size: 34px; font-weight: 800; line-height: 1.05; margin-top: 6px; color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: -.02em; } .kpi.red .v { color: var(--bad); }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 5px; }
.kpis .kpi:nth-child(7n+2) { --h: var(--h-teal); --hs: var(--h-teal-soft); } .kpis .kpi:nth-child(7n+3) { --h: var(--h-violet); --hs: var(--h-violet-soft); } .kpis .kpi:nth-child(7n+4) { --h: var(--h-amber); --hs: var(--h-amber-soft); }
.kpis .kpi:nth-child(7n+5) { --h: var(--h-green); --hs: var(--h-green-soft); } .kpis .kpi:nth-child(7n+6) { --h: var(--h-rose); --hs: var(--h-rose-soft); } .kpis .kpi:nth-child(7n+7) { --h: var(--h-slate); --hs: var(--h-slate-soft); }
.kpi.red, .kpis .kpi.red { --h: var(--bad); --hs: var(--bad-soft); } .kpi.red .l::after { content: "주의"; font-size: 11.5px; font-weight: 700; color: var(--bad); background: var(--bad-soft); padding: 1px 6px; border-radius: 4px; margin-left: auto; white-space: nowrap; flex: none; }
/* program strip */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 8px; }
.prog { border: 1px solid var(--line); border-radius: var(--radius-s); color: var(--fg); background: var(--panel) !important; padding: 9px 11px; display: grid; grid-template-columns: 30px 1fr; gap: 9px; align-items: center; min-width: 0; }
.prog .ico { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); border: 1px solid transparent; display: grid; place-items: center; font-family: var(--num); font-size: 12px; font-weight: 700; color: var(--accent); }
.prog b { font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .prog small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
/* ---- funnel: centered bars shrink stage by stage ------------------------------------------------------------------ */
.frow { display: grid; grid-template-columns: 7.6rem 1fr 3.4rem; gap: 10px; align-items: center; font-size: 12.5px; font-weight: 600; }
.frow .track { height: 16px; display: flex; justify-content: center; background: transparent; }
.frow .fill { height: 100%; min-width: 4px; border-radius: 4px; background: linear-gradient(90deg, #1d4ed8, #60a5fa); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .08); }
.frow .val { font-family: var(--num); font-size: 15px; text-align: right; font-weight: 700; }
.frow .lbl { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* rate rows (diagnosis): label · bar · value */
.rrow { display: grid; grid-template-columns: minmax(5rem, 11rem) minmax(2rem, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; min-width: 0; } @media (max-width: 480px) { .rrow { grid-template-columns: minmax(4.5rem, 7rem) minmax(1.5rem, 1fr) auto; gap: 6px; } .rrow .val small { display: none; } } .rrow .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); font-weight: 600; } .rrow .track { height: 10px; background: var(--panel-3); border-radius: 3px; overflow: hidden; } .rrow .fill { height: 100%; background: var(--accent); border-radius: 3px; } .rrow .fill.ok { background: var(--ok); } .rrow .fill.warn { background: #f59e0b; } .rrow .val { font-family: var(--num); font-weight: 700; font-size: 13px; text-align: right; white-space: nowrap; } .rrow .val small { font-weight: 500; font-family: var(--font); }
/* signal rows */
.sig { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--radius-s); background: var(--panel-2); }
.sig .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--num); font-weight: 800; color: #fff; background: var(--accent) !important; font-size: 13px; }
.sig b { font-size: 13px; display: block; } .sig small { color: var(--muted); font-size: 12px; }
.sig.click { cursor: pointer; } .sig.click:hover { outline: 2px solid var(--accent-soft-2); }
.lines { display: flex; flex-direction: column; gap: 6px; }
/* action list: text + a right-aligned count; status as a dot */
.acts { display: flex; flex-direction: column; }
.act { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; background: none; border-radius: 0; border-top: 0; border-left: 0; border-right: 0; width: 100%; font-weight: inherit; }
.act:last-child { border-bottom: 0; } .act:hover { background: var(--panel-2); } .act > * { min-width: 0; }
.act b { font-size: 13.5px; font-weight: 700; display: block; white-space: normal; overflow-wrap: anywhere; } .act small { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 1px; white-space: normal; overflow: hidden; }
.act .n { font-family: var(--num); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 2.4rem; text-align: right; color: var(--accent); }
.act .n.zero { color: #64748b; font-weight: 700; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); vertical-align: 0; flex: none; }
.dot.bad { background: var(--bad); } .dot.warn { background: #f59e0b; } .dot.ok { background: var(--ok); } .dot.accent { background: var(--accent); }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 600; font-size: 12px; }
/* highlights */
.hl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 10px 16px; }
.hl .k { color: var(--muted); font-size: 12px; font-weight: 700; display: block; } .hl .v { font-size: 14.5px; font-weight: 700; display: block; margin-top: 2px; } .hl small { color: var(--muted); font-size: 12px; display: block; }
/* ---- tables: tinted sticky header, zebra rows, sticky first column while scrolling sideways ----------------------- */
.tablebox { overflow: auto; border: 1px solid var(--line); border-radius: 10px; max-height: 34rem; background: var(--panel); scrollbar-width: thin; scrollbar-color: #aab6c8 #eef2f7; }
.tablebox::-webkit-scrollbar { width: 12px; height: 12px; } .tablebox::-webkit-scrollbar-thumb { background: #aab6c8; border-radius: 7px; border: 3px solid #fff; } .tablebox::-webkit-scrollbar-track { background: #eef2f7; }
.tablebox.vscrollable { border-bottom: 3px solid var(--line-2); } .tablebox.scrollable { box-shadow: inset -28px 0 18px -18px rgba(16, 24, 40, .16); } .scroll-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; z-index: 2; background: #f1f5fb; text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; font-weight: 700; font-size: 12px; color: #334e7a; letter-spacing: .01em; }
th button.sort { all: unset; cursor: pointer; } th button.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
th[aria-sort="ascending"] button.sort::after { content: " ↑"; color: var(--accent); } th[aria-sort="descending"] button.sort::after { content: " ↓"; color: var(--accent); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; background: var(--panel); }
.tablebox .muted { color: var(--muted); }
th.r { min-width: 4.6rem; }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { position: sticky; left: 0; } th:first-child { z-index: 3; }
td:first-child { z-index: 1; }
td.r, th.r { text-align: right; white-space: nowrap; } td.nw { white-space: nowrap; } td.b { font-weight: 700; white-space: nowrap; } td.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 12rem; } td.wr { white-space: normal; overflow-wrap: anywhere; min-width: 6rem; } .chip.wrapchip { white-space: normal; line-height: 15px; padding: 2px 7px; }
@media (max-width: 1100px) { .sec2-hide { display: none; } } @media (max-width: 1400px) { .sec3-hide { display: none; } }
td .actions, td button { white-space: nowrap; }
details.fold summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--accent); list-style: none; } details.fold summary::before { content: '▸ '; } details.fold[open] summary::before { content: '▾ '; } details.fold > .code-list { margin-top: 10px; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--accent-soft); } tbody tr.sel td { background: var(--accent-soft-2); box-shadow: inset 3px 0 0 var(--accent); } tbody tr.sel td:not(:first-child) { box-shadow: none; } tbody tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; } .sig.click:focus-visible, .cc:focus-visible { outline: 2px solid var(--accent); }
.num { font-family: var(--num); font-weight: 700; font-size: 13.5px; }
.empty { color: var(--muted); font-size: 12.5px; padding: 22px; text-align: center; border: 1px dashed var(--line-2); border-radius: var(--radius-s); background: var(--panel-2); }

/* ==== v10: one meaning per colour ===================================================================================

   대리상 구분 — 진한 파랑 기존 / 밝은 파랑 후보·잠재 / 주황 대리상 필요 / 연한 주황 진출 검토: the same on map, badges and dots

:root { --pc-cur: #1e40af; --pc-cand: #60a5fa; --pc-gap: #f59e0b; --pc-plan: #fde7b0; --dash: #64748b; --focus: #2563eb; }

.chip.st0 { background: #fff; color: #475569; border-color: #94a3b8; } .chip.st1 { background: #f1f5f9; color: #334155; border-color: #cbd5e1; } .chip.st2 { background: #ede9fe; color: #4c1d95; border-color: transparent; } .chip.st3 { background: #ddd6fe; color: #4c1d95; border-color: transparent; } .chip.st4 { background: #6d28d9; color: #fff; } .chip.st5 { background: #4c1d95; color: #fff; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: #92400e; } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.sel { background: var(--ok-soft); color: var(--ok); border-color: #b7e4c7; } .chip.rej { background: var(--bad-soft); color: var(--bad); border-color: #f5c2bd; } .chip.hold { background: var(--warn-soft); color: #92400e; }
.chip.step1 { background: #f1f5f9; color: #334155; } .chip.step2 { background: #dbeafe; color: #1e3a8a; } .chip.step3 { background: #1e40af; color: #fff; }
.dot.pc-cur { background: var(--pc-cur); } .dot.pc-cand { background: var(--pc-cand); } .dot.pc-gap { background: var(--pc-gap); } .dot.pc-none { background: #fff; box-shadow: inset 0 0 0 1.5px #94a3b8; }
.dash { color: var(--dash); }
.act .n.t-bad { color: var(--bad); } .act .n.t-warn { color: #92400e; }
.lateTxt { color: var(--bad); font-weight: 700; } .lateMuted { color: var(--muted); font-weight: 600; }

<script id="launch-guide" type="application/json">{"steps":[{"n":1,"phase":1,"short":"타겟 국가 선정","title":"타겟 국가 전략적 선정","desc":"신제품 기술적 특성, 시장 규모, 자사 경쟁 우위 분석을 통한 최우선 진출 국가 도출"},{"n":2,"phase":1,"short":"시장·규제 조사","title":"현지 시장 및 규제 환경 조사","desc":"타겟 국가 주요 유통망 구조, 경쟁품 단가 및 인허가 규제 요건 사전 리서치"},{"n":3,"phase":1,"short":"대리상 발굴·컨택","title":"현지 대리상 발굴 및 초기 컨택","desc":"현지 수입 자격 및 영업망을 보유한 최적의 대리상 후보군 발굴 및 컨택"},{"n":4,"phase":1,"short":"킥오프·NDA","title":"킥오프 미팅 및 NDA 체결","desc":"후보 대리상과 초기 화상 미팅 진행 및 정보 보호를 위한 비밀유지계약(NDA) 체결"},{"n":5,"phase":2,"short":"텀시트·샘플","title":"텀시트(Term Sheet) 체결 및 샘플 발송","desc":"가단가, MOQ 등 초기 거래 조건 협의(MOU) 완료 및 현지 평가용 샘플 제공"},{"n":6,"phase":2,"short":"피드백·설계 동결","title":"현지 피드백 수집 및 설계 동결(Design Freeze)","desc":"평가용 샘플의 실사용 피드백 수렴 후, 유관부서 조율을 통해 수출용 제품 스펙 최종 확정"},{"n":7,"phase":2,"short":"수출 본계약","title":"수출 본계약 체결","desc":"최종 납품 단가 확정 및 '현지 허가권 소유주' 등 당사에 유리한 조건으로 정식 딜 클로징"},{"n":8,"phase":3,"short":"인허가 서류 세팅","title":"인허가 제출 서류(Sales Pkg) 세팅","desc":"당사 보유 성적서 갭(Gap) 분석, 영문 기술문서(Master STED) 가공 및 번역 진행"},{"n":9,"phase":3,"short":"당국 접수·심사","title":"현지 당국 서류 접수 및 심사 대응","desc":"규제 당국에 인허가 서류 공식 접수 및 심사관 보완 요청 밀착 대응"},{"n":10,"phase":3,"short":"허가증·P.O 수령","title":"공식 판매 허가증 획득 및 발주(P.O) 수령","desc":"현지 판매 승인(License) 획득 완료 후, 정식 발주서 접수 및 내부 양산 일정 조율"},{"n":11,"phase":3,"short":"런칭 마케팅","title":"초기 런칭 마케팅 지원(Sales Kit)","desc":"원활한 현지 런칭을 위해 마케팅 툴킷(임상 데이터, 세일즈 포인트 등)을 세팅하고 현지 영업망 교육 진행"},{"n":12,"phase":3,"short":"3개년 성과 평가","title":"3개년 성과 평가 및 포트폴리오 재편(Exit Point)","desc":"공식 런칭 3년 후, 대리상 매출 달성률을 종합 평가하여 재계약 여부 결정 및 글로벌 정규 포트폴리오(Group 1, 2, 3)로 편입"}],"phases":[{"k":1,"a":1,"b":4,"name":"진출 기획 및 파트너 발굴","short":"진출 기획 · 파트너 발굴"},{"k":2,"a":5,"b":7,"name":"계약 및 제품 스펙 확정","short":"계약 · 제품 스펙 확정"},{"k":3,"a":8,"b":12,"name":"인허가 획득 및 현지 런칭","short":"인허가 획득 · 현지 런칭"}],"source":"신제품 진출전략 관리툴 2026-11-02"}</script>

const LAUNCH_GUIDE = (() => { try { const n = document.getElementById('launch-guide'); return n ? JSON.parse(n.textContent) : {steps: [], phases: []}; } catch (e) { return {steps: [], phases: []}; } })();
const STEP_INFO = (n) => LAUNCH_GUIDE.steps.find((s) => s.n === Number(n)) || null;

const PHASE_NAME = {1: '진출 기획 · 파트너 발굴', 2: '계약 · 제품 스펙 확정', 3: '인허가 획득 · 현지 런칭'};
const stepLabel = (n) => { const s = STEP_INFO(n); return n ? `STEP${n}${s ? ' ' + s.short : ''}` : ''; };
// readiness of a market for a product from its launch step: 허가·PO 이후 1.0 … 조사 단계 0.2, 없음 0
const readinessOfStep = (n) => (n >= 10 ? 1 : n >= 8 ? 0.75 : n >= 5 ? 0.5 : n >= 3 ? 0.35 : n >= 1 ? 0.2 : 0);
const launchMatchesProduct = (l, pr) => { if (!pr) return false; const ids = Array.isArray(l.product_ids) ? l.product_ids : split(l.product_ids); if (ids.includes(pr.product_id)) return true; const nm = norm(l.product); return !!nm && (nm === norm(pr.product_name) || split(pr.aliases).map(norm).includes(nm)); };
const launchCountries = (l) => { const cs = Array.isArray(l.countries) ? l.countries : split(l.countries); return cs.length ? cs : (l.country ? [l.country] : []); };
function launchesFor(pr, country) {

  return all.filter((l) => !launchCountries(l).length && l.region && l.region === (REGION_OF[country] || '')).map((l) => ({...l, _regional: true}));

function launchStats() {

  const byPhase = {1: 0, 2: 0, 3: 0}; for (const l of ls) byPhase[PHASE_OF_STEP(Number(l.step) || 0)] = (byPhase[PHASE_OF_STEP(Number(l.step) || 0)] || 0) + 1;

// ================= D2D lead engine: score · qualification · routing · next actions =================
const PROGRAM_W = {'VCP': 10, 'Meet the Master': 10, '심포지엄': 6, '학회·전시': 4, 'Webinar': 2};
const STAGE_W = {'잠재': 0, '1차접촉': 15, '니즈확인': 35, '견적제출': 55, '협상중': 75, '주문완료': 100};
// 0-100: how worth working this lead is right now, with the reasons (used for sorting queues and the partner hand-off)
function leadScore(c, today) {
  today = today || todayISO();
  const why = []; let s = STAGE_W[c.stage] || 0; why.push(`단계 ${c.stage || '잠재'} ${s}`);
  const touches = Math.max(0, (c.visits || 1) - 1); if (touches) { const t = Math.min(24, touches * 8); s += t; why.push(`추가 접점 ${touches}회 +${t}`); }
  const age = c.last_date ? daysBetween(today, c.last_date) : 999;
  const rec = age <= 30 ? 15 : age <= 90 ? 8 : age <= 180 ? 2 : 0; if (rec) { s += rec; why.push(`최근 접촉 ${age}일 +${rec}`); } else if (age > 180) why.push(`${age}일 미접촉`);
  const pw = Math.max(0, ...split(c.programs).map((p) => PROGRAM_W[p] || 0)); if (pw) { s += pw; why.push(`프로그램 가중 +${pw}`); }
  const prods = productsByName(c.product); const pr = prods[0];
  const step = pr ? launchStepFor(pr, c.country) : 0; const lr = readinessOfStep(step); if (lr) { const b = Math.round(10 * lr); s += b; why.push(`${c.country} ${stepLabel(step)} +${b}`); }
  const cov = rows('partners').filter((p) => FREE.coverageOf(p).includes(c.country) && p.status !== '거래종료'); if (cov.some((p) => p.status === '기존 대리상')) { s += 5; why.push('기존 대리상 있음 +5'); }
  if (sourcePartnerIdOf(c)) { s += 5; why.push('모객 대리상 있음 +5'); }
  if (c.stage === '주문완료') s = 100;
  return {score: Math.max(0, Math.min(100, Math.round(s))), why};
}
// partners able to follow up a lead: cover its country, carry its product category; 기존 > 후보 > 잠재, then rating
function suggestPartnersForLead(c) {

  const out = rows('partners').filter((p) => p.status !== '거래종료' && FREE.coverageOf(p).includes(c.country))

    .sort((a, b) => (rank[a.p.status] ?? 3) - (rank[b.p.status] ?? 3) || (b.prodHit - a.prodHit) || (b.catHit - a.catHit) || (Number(b.p.rating) || 0) - (Number(a.p.rating) || 0))
    .map((x) => ({partner: x.p, reason: [x.p.status, x.prodHit ? '제품 취급' : x.catHit ? '카테고리 일치' : '', Number(x.p.rating) ? `평가 ${x.p.rating}` : ''].filter(Boolean).join(' · ')}));

function leadActions(cs, today) {
  today = today || todayISO();
  const out = [];
  for (const c of cs) {
    if (c.state === 'ARCHIVED' || c.stage === '잠재') continue;
    const age = c.last_date ? Math.max(0, daysBetween(today, c.last_date)) : 999;
    // 휴면(90일 이상 무활동)은 SLA 지연과 따로 센다 — 한 리드가 두 곳에 잡히지 않게
    if (c.state === 'DORMANT') { if ((SCORE[c.stage] || 0) >= 2) out.push({c, key: 'dormant', action: '90일 이상 무활동 — 재활성화 연락 또는 종결', late: 0, dormantDays: age, age}); continue; }
    const rule = SLA_OF(c.stage); if (!rule || age < rule.start) continue;
    out.push({c, key: rule.key, action: rule.action, late: Math.max(0, age - rule.due), due: rule.due, age});
  }
  for (const a of out) { a.score = leadScore(a.c, today).score; a.partner = a.c.partner_id ? partnerName(a.c.partner_id) : ''; a.suggest = a.c.partner_id ? null : (suggestPartnersForLead(a.c)[0] || null); }

  const lines = leads.map((c) => `- ${c.person}${c.org ? ' (' + c.org + ')' : ''} · ${c.country}${c.product && c.product !== '미분류' ? ' · 관심 ' + c.product : ''}${c.key ? ' · ' + c.key : ''}`);
  return `[글로벌사업부] ${ev.event || ev.program} (${ev.date}) 참석자 명단 전달 — ${partner.partner_name}\n\n안녕하세요, 글로벌사업부입니다. ${ev.date} ${ev.program} 「${ev.event || ev.program}」에 참석한 ${partner.country} 지역 의사·기관 ${leads.length}명의 명단입니다. 2주 안에 접촉해 주시고, 관심이 확인된 분(제품·수량·시기)은 「니즈확인」, 견적을 요청한 분은 「견적」으로 회신 부탁드립니다. 회신 주신 분만 본사에서 유효리드로 추적합니다.\n\n${lines.join('\n')}\n\n회신: 글로벌사업부 (담당 영업 ${partner.owner || '미지정'})`;
}
